name: Unit Tests

on:
  push:
    branches: [ main, task-1, task-2, task-3 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v "pywinpty\|colorama" requirements.txt | pip install -r /dev/stdin
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v